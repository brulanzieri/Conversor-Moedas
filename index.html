<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styless.css"/>
    <title>Conversor de Moedas</title>
  </head>
  <body>
    <img id="logo" src="/Assets/logo.png" alt="logo-money-convert" />

    <h1>Conversor de Moedas</h1>

    <main>

        <label>
            Converter <b>de</b>
            <select class="currency-current">
                <option value="real">R$ Real Brasileiro</option>
                <option value="dollar">US$ Dólar Americano</option>
                <option value="euro">€ Euro</option>
                <option value="libra">£ Libra</option>
                <option value="bitcoin">BTC Bitcoin</option>
            </select>
        </label>

        <label>
            Converter <b>para</b>
            <select class="currency-select">
                <option value="dollar">US$ Dólar Americano</option>
                <option value="euro">€ Euro</option>
                <option value="libra">£ Libra</option>
                <option value="bitcoin">BTC Bitcoin</option>
                <option value="real">R$ Real Brasileiro</option>
            </select>
        </label>

        <label>
            Valor
            <input class="input-currency" placeholder="R$ 10.000,00" type="number">
        </label>

        <button>Converter</button>

        <section>
            <div class="moneyConvert">
                <img id="real" class="currency-image" src="/Assets/real.png" alt="logo-real" />
                <p class="currency-name" class="currency">Real</p>
                <p class="currency-value">R$ 0,00</p>
            </div>

            <img id="arrow" src="/Assets/arrow.png" alt="arrow" />

            <div class="newMoney">
                <img id="dollar" class="currency-image-converted" src="/Assets/dollar.png" alt="logo-dollar" />
                <p class="currency-name-converted"  class="currency">Dólar Americano</p>
                <p class="currency-value-converted">US$ 0,00</p>
            </div>

        </section>
        
    </main>

    <div class="hiddenMoney">
                <img id="euro" src="/Assets/euro.png" alt="logo-euro" />
                <img id="libra" src="/Assets/libra.png" alt="logo-libra" />
                <img id="bitcoin" src="/Assets/bitcoin.png" alt="logo-bitcoin" />
                <img id="real" src="/Assets/real.png" alt="logo-real" />
                <img id="dollar" class="currency-image" src="/Assets/dollar.png" alt="logo-dollar" />
    </div>
    
  </body>

  <script src="/scripts.js"></script>

</html>
